[project]
name = "mats-mechanistic-interpretability"
version = "0.1.0"
description = "Experiments in mechanistic interpretability of language models"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.14",
    "gptqmodel>=5.8",
    "huggingface-hub>=0.30",
    "matplotlib>=3.8",
    "safetensors>=0.5",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers>=4.51",
]

[project.optional-dependencies]
download = [
    "hf-transfer>=0.1.9",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
